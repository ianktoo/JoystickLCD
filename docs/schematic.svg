<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 580" font-family="Verdana, Arial, sans-serif" font-size="13">
  <rect x="0" y="0" width="820" height="580" fill="#ffffff"/>

  <!-- Title -->
  <text x="20" y="24" font-size="16" font-weight="bold" fill="#222">JoystickLCD - Wiring Schematic</text>

  <!-- Arduino Uno R4 WiFi -->
  <rect x="30" y="180" width="210" height="190" rx="8" fill="#e8f0fe" stroke="#3b5bdb" stroke-width="2"/>
  <text x="135" y="205" text-anchor="middle" font-weight="bold" fill="#1c2b6b">Arduino Uno R4 WiFi</text>

  <!-- Arduino signal pins (right edge) -->
  <circle cx="240" cy="230" r="4" fill="#3b5bdb"/>
  <text x="130" y="234" text-anchor="end" fill="#222">A0</text>
  <circle cx="240" cy="255" r="4" fill="#3b5bdb"/>
  <text x="130" y="259" text-anchor="end" fill="#222">A1</text>
  <circle cx="240" cy="280" r="4" fill="#3b5bdb"/>
  <text x="130" y="284" text-anchor="end" fill="#222">D2</text>
  <circle cx="240" cy="305" r="4" fill="#3b5bdb"/>
  <text x="130" y="309" text-anchor="end" fill="#222">SDA</text>
  <circle cx="240" cy="330" r="4" fill="#3b5bdb"/>
  <text x="130" y="334" text-anchor="end" fill="#222">SCL</text>
  <circle cx="240" cy="355" r="4" fill="#3b5bdb"/>
  <text x="130" y="359" text-anchor="end" fill="#222">D4 (optional, SD CS)</text>

  <!-- Arduino power pins (bottom edge) -->
  <circle cx="90" cy="370" r="4" fill="#c0392b"/>
  <text x="90" y="392" text-anchor="middle" fill="#222">5V</text>
  <circle cx="170" cy="370" r="4" fill="#333333"/>
  <text x="170" y="392" text-anchor="middle" fill="#222">GND</text>

  <!-- Power buses -->
  <line x1="90" y1="370" x2="90" y2="520" stroke="#c0392b" stroke-width="2"/>
  <line x1="90" y1="520" x2="700" y2="520" stroke="#c0392b" stroke-width="2"/>
  <text x="705" y="524" fill="#c0392b">5V bus</text>

  <line x1="170" y1="370" x2="170" y2="545" stroke="#333333" stroke-width="2"/>
  <line x1="170" y1="545" x2="700" y2="545" stroke="#333333" stroke-width="2"/>
  <text x="705" y="549" fill="#333333">GND bus</text>

  <!-- Joystick (Freenove) -->
  <rect x="560" y="40" width="210" height="150" rx="8" fill="#eafaf1" stroke="#1e8449" stroke-width="2"/>
  <text x="665" y="65" text-anchor="middle" font-weight="bold" fill="#145a32">Freenove Joystick</text>
  <circle cx="560" cy="90" r="4" fill="#3b5bdb"/>
  <text x="575" y="94" fill="#222">VRx</text>
  <circle cx="560" cy="115" r="4" fill="#3b5bdb"/>
  <text x="575" y="119" fill="#222">VRy</text>
  <circle cx="560" cy="140" r="4" fill="#3b5bdb"/>
  <text x="575" y="144" fill="#222">SW</text>
  <line x1="665" y1="190" x2="665" y2="520" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="672" y="200" fill="#c0392b" font-size="11">VCC -&gt; 5V bus</text>
  <line x1="690" y1="190" x2="690" y2="545" stroke="#333333" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="697" y="215" fill="#333333" font-size="11">GND -&gt; GND bus</text>

  <!-- Signal wires: Arduino -> Joystick -->
  <line x1="240" y1="230" x2="560" y2="90" stroke="#3b5bdb" stroke-width="1.5"/>
  <line x1="240" y1="255" x2="560" y2="115" stroke="#3b5bdb" stroke-width="1.5"/>
  <line x1="240" y1="280" x2="560" y2="140" stroke="#3b5bdb" stroke-width="1.5"/>

  <!-- 16x2 I2C LCD -->
  <rect x="560" y="230" width="210" height="110" rx="8" fill="#fef9e7" stroke="#b7950b" stroke-width="2"/>
  <text x="665" y="255" text-anchor="middle" font-weight="bold" fill="#7d6608">16x2 I2C LCD</text>
  <circle cx="560" cy="280" r="4" fill="#3b5bdb"/>
  <text x="575" y="284" fill="#222">SDA</text>
  <circle cx="560" cy="305" r="4" fill="#3b5bdb"/>
  <text x="575" y="309" fill="#222">SCL</text>
  <line x1="700" y1="340" x2="700" y2="520" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="600" y="355" fill="#c0392b" font-size="11">VCC -&gt; 5V bus</text>
  <line x1="720" y1="340" x2="720" y2="545" stroke="#333333" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="600" y="370" fill="#333333" font-size="11">GND -&gt; GND bus</text>

  <!-- Signal wires: Arduino -> LCD -->
  <line x1="240" y1="305" x2="560" y2="280" stroke="#3b5bdb" stroke-width="1.5"/>
  <line x1="240" y1="330" x2="560" y2="305" stroke="#3b5bdb" stroke-width="1.5"/>

  <!-- Optional SD card module -->
  <rect x="560" y="400" width="210" height="120" rx="8" fill="#f5eef8" stroke="#8e44ad" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="665" y="422" text-anchor="middle" font-weight="bold" fill="#5b2c6f">SD Card Module (optional)</text>
  <text x="665" y="440" text-anchor="middle" font-size="11" fill="#5b2c6f">for on-device logging / settings</text>
  <circle cx="560" cy="460" r="4" fill="#3b5bdb"/>
  <text x="575" y="464" fill="#222">CS -&gt; D4</text>
  <text x="575" y="484" fill="#666" font-size="11">MOSI/MISO/SCK -&gt; Arduino SPI (D11-D13)</text>
  <text x="575" y="502" fill="#666" font-size="11">VCC/GND -&gt; power buses</text>

  <!-- Signal wire: Arduino -> SD CS -->
  <line x1="240" y1="355" x2="560" y2="460" stroke="#3b5bdb" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Legend -->
  <text x="30" y="410" font-size="12" fill="#444">Legend:</text>
  <line x1="30" y1="425" x2="60" y2="425" stroke="#3b5bdb" stroke-width="1.5"/>
  <text x="66" y="429" font-size="12" fill="#444">signal wire</text>
  <line x1="30" y1="443" x2="60" y2="443" stroke="#3b5bdb" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="66" y="447" font-size="12" fill="#444">optional signal wire</text>
  <rect x="30" y="458" width="30" height="12" fill="none" stroke="#8e44ad" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="66" y="468" font-size="12" fill="#444">optional module</text>
</svg>
