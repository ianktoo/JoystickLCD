<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Verdana, Arial, sans-serif" font-size="12">
  <defs>
    <!-- one tile = one 5-hole column strip; holes at +8,+24,+40,+56,+72 -->
    <pattern id="col" x="57" y="192" width="26" height="80" patternUnits="userSpaceOnUse">
      <rect x="3" y="0" width="20" height="80" rx="2" fill="#e3e7eb"/>
      <circle cx="13" cy="8" r="3" fill="#495057"/>
      <circle cx="13" cy="24" r="3" fill="#495057"/>
      <circle cx="13" cy="40" r="3" fill="#495057"/>
      <circle cx="13" cy="56" r="3" fill="#495057"/>
      <circle cx="13" cy="72" r="3" fill="#495057"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="900" height="640" fill="#ffffff"/>

  <text x="20" y="24" font-size="16" font-weight="bold" fill="#222">JoystickLCD - 74HC595 Breadboard Layout</text>
  <text x="20" y="42" font-size="11" fill="#666">Each grey strip is ONE connection point (5 holes joined vertically). The two halves are split by the centre gap.</text>

  <!-- board -->
  <rect x="30" y="100" width="842" height="372" rx="8" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/>
  <rect x="30" y="284" width="842" height="16" fill="#dee2e6"/>
  <text x="520" y="296" font-size="10" fill="#6c757d">centre gap: top and bottom halves are NOT connected</text>

  <!-- column strips: top half and bottom half -->
  <rect x="57" y="192" width="780" height="80" fill="url(#col)"/>
  <g transform="translate(0,120)">
    <rect x="57" y="192" width="780" height="80" fill="url(#col)"/>
  </g>

  <!-- power rails -->
  <line x1="75" y1="132" x2="850" y2="132" stroke="#c0392b" stroke-width="2"/>
  <line x1="75" y1="150" x2="850" y2="150" stroke="#2c3e50" stroke-width="2"/>
  <text x="38" y="136" font-size="11" fill="#c0392b">5V</text>
  <text x="38" y="154" font-size="11" fill="#2c3e50">GND</text>
  <line x1="75" y1="430" x2="850" y2="430" stroke="#2c3e50" stroke-width="2"/>
  <line x1="75" y1="448" x2="850" y2="448" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 4" opacity="0.4"/>
  <text x="38" y="434" font-size="11" fill="#2c3e50">GND</text>
  <text x="38" y="452" font-size="11" fill="#c0392b" opacity="0.5">5V</text>

  <!-- ===== 74HC595 (notch left: pin 1 bottom-left, pin 16 top-left) ===== -->
  <g stroke="#adb5bd" stroke-width="5">
    <line x1="304" y1="264" x2="304" y2="270"/><line x1="330" y1="264" x2="330" y2="270"/>
    <line x1="356" y1="264" x2="356" y2="270"/><line x1="382" y1="264" x2="382" y2="270"/>
    <line x1="408" y1="264" x2="408" y2="270"/><line x1="434" y1="264" x2="434" y2="270"/>
    <line x1="460" y1="264" x2="460" y2="270"/><line x1="486" y1="264" x2="486" y2="270"/>
    <line x1="304" y1="314" x2="304" y2="320"/><line x1="330" y1="314" x2="330" y2="320"/>
    <line x1="356" y1="314" x2="356" y2="320"/><line x1="382" y1="314" x2="382" y2="320"/>
    <line x1="408" y1="314" x2="408" y2="320"/><line x1="434" y1="314" x2="434" y2="320"/>
    <line x1="460" y1="314" x2="460" y2="320"/><line x1="486" y1="314" x2="486" y2="320"/>
  </g>
  <rect x="290" y="268" width="210" height="48" rx="3" fill="#212529"/>
  <path d="M290,286 a6,6 0 0 1 0,12" fill="#e3e7eb"/>
  <text x="280" y="290" font-size="10" fill="#222" text-anchor="end" font-weight="bold">SN74HC595N</text>
  <text x="280" y="303" font-size="9" fill="#666" text-anchor="end">notch on the left</text>

  <!-- top-row pin numbers + names -->
  <g fill="#ffffff" text-anchor="middle">
    <g font-size="9" font-weight="bold">
      <text x="304" y="279">16</text><text x="330" y="279">15</text><text x="356" y="279">14</text><text x="382" y="279">13</text>
      <text x="408" y="279">12</text><text x="434" y="279">11</text><text x="460" y="279">10</text><text x="486" y="279">9</text>
    </g>
    <g font-size="7.5" fill="#ced4da">
      <text x="304" y="289">VCC</text><text x="330" y="289">QA</text><text x="356" y="289">SER</text><text x="382" y="289">OE</text>
      <text x="408" y="289">RCLK</text><text x="434" y="289">SRCLK</text><text x="460" y="289">SRCLR</text><text x="486" y="289">QH'</text>
    </g>
    <g font-size="7.5" fill="#ced4da">
      <text x="304" y="300">QB</text><text x="330" y="300">QC</text><text x="356" y="300">QD</text><text x="382" y="300">QE</text>
      <text x="408" y="300">QF</text><text x="434" y="300">QG</text><text x="460" y="300">QH</text><text x="486" y="300">GND</text>
    </g>
    <g font-size="9" font-weight="bold">
      <text x="304" y="311">1</text><text x="330" y="311">2</text><text x="356" y="311">3</text><text x="382" y="311">4</text>
      <text x="408" y="311">5</text><text x="434" y="311">6</text><text x="460" y="311">7</text><text x="486" y="311">8</text>
    </g>
  </g>

  <!-- ===== Power wires ===== -->
  <!-- Arduino 5V and GND to rails -->
  <line x1="90" y1="132" x2="90" y2="78" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="90" cy="132" r="4" fill="#c0392b"/>
  <text x="96" y="72" text-anchor="end" font-size="11" fill="#c0392b">Arduino 5V</text>
  <line x1="120" y1="150" x2="120" y2="78" stroke="#2c3e50" stroke-width="3" stroke-linecap="round"/>
  <circle cx="120" cy="150" r="4" fill="#2c3e50"/>
  <text x="126" y="72" font-size="11" fill="#2c3e50">Arduino GND</text>

  <!-- pin 16 VCC and pin 10 SRCLR -> 5V rail -->
  <line x1="304" y1="216" x2="304" y2="132" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="304" cy="216" r="4" fill="#c0392b"/><circle cx="304" cy="132" r="4" fill="#c0392b"/>
  <line x1="460" y1="216" x2="460" y2="132" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="460" cy="216" r="4" fill="#c0392b"/><circle cx="460" cy="132" r="4" fill="#c0392b"/>

  <!-- pin 13 OE -> GND rail -->
  <line x1="382" y1="216" x2="382" y2="150" stroke="#2c3e50" stroke-width="3" stroke-linecap="round"/>
  <circle cx="382" cy="216" r="4" fill="#2c3e50"/><circle cx="382" cy="150" r="4" fill="#2c3e50"/>

  <!-- pin 8 GND -> bottom GND rail -->
  <line x1="486" y1="336" x2="486" y2="430" stroke="#2c3e50" stroke-width="3" stroke-linecap="round"/>
  <circle cx="486" cy="336" r="4" fill="#2c3e50"/><circle cx="486" cy="430" r="4" fill="#2c3e50"/>

  <!-- link top GND rail to bottom GND rail -->
  <line x1="850" y1="150" x2="850" y2="430" stroke="#2c3e50" stroke-width="3" stroke-linecap="round"/>
  <circle cx="850" cy="150" r="4" fill="#2c3e50"/><circle cx="850" cy="430" r="4" fill="#2c3e50"/>
  <text x="842" y="330" font-size="10" fill="#2c3e50" text-anchor="end">GND rails linked</text>

  <!-- ===== Signal wires to Arduino ===== -->
  <g stroke="#3b5bdb" stroke-width="3" stroke-linecap="round">
    <line x1="356" y1="200" x2="356" y2="90"/>
    <line x1="408" y1="200" x2="408" y2="90"/>
    <line x1="434" y1="200" x2="434" y2="90"/>
  </g>
  <g fill="#3b5bdb">
    <circle cx="356" cy="200" r="4"/><circle cx="408" cy="200" r="4"/><circle cx="434" cy="200" r="4"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#3b5bdb" font-weight="bold">
    <text x="356" y="84">D7</text>
    <text x="408" y="84">D6</text>
    <text x="434" y="84">D5</text>
  </g>

  <!-- ===== Output jumpers to free columns (orange) ===== -->
  <g stroke="#d35400" stroke-width="3" stroke-linecap="round">
    <line x1="330" y1="232" x2="538" y2="232"/>   <!-- QA -> col19 (top) -->
    <line x1="304" y1="384" x2="538" y2="384"/>   <!-- QB -> col19 (bottom) -->
    <line x1="330" y1="368" x2="226" y2="368"/>   <!-- QC -> col7 (bottom) -->
  </g>
  <g fill="#d35400">
    <circle cx="330" cy="232" r="4"/><circle cx="538" cy="232" r="4"/>
    <circle cx="304" cy="384" r="4"/><circle cx="538" cy="384" r="4"/>
    <circle cx="330" cy="368" r="4"/><circle cx="226" cy="368" r="4"/>
  </g>

  <!-- ===== Resistors (bridge two different columns) ===== -->
  <g stroke="#8d6e63" stroke-width="1.5">
    <!-- QA: col19 -> col22, top half -->
    <line x1="538" y1="248" x2="616" y2="248"/>
    <rect x="552" y="243" width="50" height="10" rx="2" fill="#e8c9a0"/>
    <!-- QB: col19 -> col22, bottom half -->
    <line x1="538" y1="336" x2="616" y2="336"/>
    <rect x="552" y="331" width="50" height="10" rx="2" fill="#e8c9a0"/>
    <!-- QC: col7 -> col4, bottom half -->
    <line x1="148" y1="336" x2="226" y2="336"/>
    <rect x="162" y="331" width="50" height="10" rx="2" fill="#e8c9a0"/>
  </g>
  <g fill="#6d4c41">
    <circle cx="538" cy="248" r="3"/><circle cx="616" cy="248" r="3"/>
    <circle cx="538" cy="336" r="3"/><circle cx="616" cy="336" r="3"/>
    <circle cx="148" cy="336" r="3"/><circle cx="226" cy="336" r="3"/>
  </g>
  <g font-size="10" fill="#6d4c41" text-anchor="middle">
    <text x="577" y="264">220&#937;</text>
    <text x="577" y="325">220&#937;</text>
    <text x="187" y="325">220&#937;</text>
  </g>

  <!-- ===== LEDs (anode = long leg, toward the resistor side) ===== -->
  <!-- QA: anode col22, cathode col23, top half -->
  <g stroke="#555" stroke-width="2">
    <line x1="629" y1="220" x2="616" y2="232"/><line x1="629" y1="220" x2="642" y2="232"/>
  </g>
  <circle cx="629" cy="220" r="9" fill="#e74c3c" stroke="#922b21" stroke-width="1.5"/>
  <!-- QB: anode col22, cathode col23, bottom half -->
  <g stroke="#555" stroke-width="2">
    <line x1="629" y1="344" x2="616" y2="352"/><line x1="629" y1="344" x2="642" y2="352"/>
  </g>
  <circle cx="629" cy="344" r="9" fill="#f4d03f" stroke="#9a7d0a" stroke-width="1.5"/>
  <!-- QC: anode col4, cathode col3, bottom half -->
  <g stroke="#555" stroke-width="2">
    <line x1="135" y1="344" x2="148" y2="352"/><line x1="135" y1="344" x2="122" y2="352"/>
  </g>
  <circle cx="135" cy="344" r="9" fill="#58d68d" stroke="#1e8449" stroke-width="1.5"/>
  <g font-size="9" fill="#222" text-anchor="middle">
    <text x="629" y="223">1</text>
    <text x="629" y="347">2</text>
    <text x="135" y="347">3</text>
  </g>

  <!-- LED cathode -> GND -->
  <g stroke="#2c3e50" stroke-width="3" stroke-linecap="round">
    <line x1="642" y1="200" x2="642" y2="150"/>
    <line x1="642" y1="368" x2="642" y2="430"/>
    <line x1="122" y1="368" x2="122" y2="430"/>
  </g>
  <g fill="#2c3e50">
    <circle cx="642" cy="200" r="4"/><circle cx="642" cy="150" r="4"/>
    <circle cx="642" cy="368" r="4"/><circle cx="642" cy="430" r="4"/>
    <circle cx="122" cy="368" r="4"/><circle cx="122" cy="430" r="4"/>
  </g>

  <!-- ===== Notes ===== -->
  <text x="30" y="500" font-size="12" font-weight="bold" fill="#222">How to read this</text>
  <text x="30" y="520" font-size="11" fill="#444">- Only the dots are connections. Wires that cross over each other or over a rail do NOT connect.</text>
  <text x="30" y="538" font-size="11" fill="#444">- Each output climbs to a fresh column via a jumper (orange), then resistor -> LED each bridge a NEW column, then a wire to GND.</text>
  <text x="30" y="556" font-size="11" fill="#444">- Never put both legs of a resistor or LED in the same column: current would bypass the part through the strip.</text>
  <text x="30" y="574" font-size="11" fill="#444">- LED long leg (anode, +) goes toward the resistor; short leg (cathode) goes toward GND.</text>
  <text x="30" y="592" font-size="11" fill="#444">- Some breadboards split the power rails in the middle. If yours does, bridge the gap or LEDs near the ends may get no power.</text>
  <text x="30" y="616" font-size="11" fill="#444">Top row (left to right): 16 VCC, 15 QA, 14 SER, 13 OE, 12 RCLK, 11 SRCLK, 10 SRCLR, 9 QH'.   Bottom row: 1 QB, 2 QC, 3 QD ... 8 GND.</text>
</svg>
